name: necookey debug APK

# One variant only: fullStandard release (R8 + shrinkResources, signed with keystore/necookey-ci.jks),
# arm64-v8a. No lint, no other flavors. (Workflow name kept for tooling.)
on:
  push:
    branches: [sumire-fork, main, sumire-lm-app]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'images/**'
      - 'fastlane/**'
      - 'fdroid/**'
      - 'investigation/**'
      - 'LICENSE'
      - 'ENGLISH_DICTIOANRY_LICENSE'
      - '.idea/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'images/**'
      - 'fastlane/**'
      - 'fdroid/**'
      - 'investigation/**'
      - 'LICENSE'
      - 'ENGLISH_DICTIOANRY_LICENSE'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: necookey-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  ZENZ_MODEL_CACHE_DIR: ${{ github.workspace }}/.zenz-model-cache
  ZENZ_USE_CCACHE: 'true'
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC"
  GRADLE_FLAGS: >-
    --build-cache --configuration-cache --configuration-cache-problems=warn
    --parallel --stacktrace
    -PnecookeyAbi=arm64-v8a
    -PzenzDebugNativeAbis=arm64-v8a
    -PzenzDebugOptimizedNative=true
    -PzenzReleaseNativeAbis=arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write only so pushes to main can update the rolling `nightly` prerelease.
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout (with llama.cpp submodule, shallow)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Detect touched modules
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app: ['app/**']
            core: ['core/**']
            zenz: ['zenz/**']
            custom_keyboard: ['custom_keyboard/**']

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle user home + build cache + configuration cache, pruned by the action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/sumire-fork' }}

      # The runner image already ships the SDK, platform 36 and NDK 29. Only CMake 3.22.1 is
      # missing; cache just that directory (~50 MB) instead of the whole SDK.
      - name: Cache CMake 3.22.1
        id: cmake-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-cmake-3.22.1-${{ runner.os }}
      - name: Install CMake 3.22.1
        if: steps.cmake-cache.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null

      - name: ccache for zenz / llama.cpp
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zenz-arm64-${{ hashFiles('zenz/src/main/cpp/CMakeLists.txt') }}
          max-size: 400M

      # The GGUF is downloaded + quantized once and reused (restore/save split so a failed
      # build still keeps the model).
      - name: Restore zenz model
        id: zenz-model
        uses: actions/cache/restore@v4
        with:
          path: .zenz-model-cache
          key: zenz-model-v32small-c67e03e0-Q5_K_M

      - name: Prepare zenz model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./gradlew :zenz:prepareZenzModel $GRADLE_FLAGS

      - name: Save zenz model
        if: always() && steps.zenz-model.outputs.cache-hit != 'true' && hashFiles('.zenz-model-cache/*.gguf') != ''
        uses: actions/cache/save@v4
        with:
          path: .zenz-model-cache
          key: zenz-model-v32small-c67e03e0-Q5_K_M

      # SUMIRE-LM 案2 ラティス辺コスト表: 孤立ブランチ lm-data の固定コミットから git で取り出す（非公開リポジトリなので raw URL は不可）。
      # sha256 は app/build.gradle の fetchLatticeLmTable が照合し、不一致ならビルド失敗。
      - name: Fetch lattice LM table (lm-data, pinned)
        run: |
          git fetch -q --depth=1 origin 63732f821b7100dc6e3b9a47ea7725818151ea84
          git show 63732f821b7100dc6e3b9a47ea7725818151ea84:lc_np1m.slc > "$RUNNER_TEMP/lc_np1m.slc"
          echo "LATTICE_LM_FLAGS=-PlatticeLmTableFile=$RUNNER_TEMP/lc_np1m.slc" >> "$GITHUB_ENV"

      - name: Build fullStandard release APK (arm64-v8a)
        run: ./gradlew :app:assembleFullStandardRelease $GRADLE_FLAGS $LATTICE_LM_FLAGS

      - name: JVM unit tests (touched modules only)
        continue-on-error: true  # exp: 挙動を変えたテストが落ちても APK は出す
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.custom_keyboard == 'true' || steps.changes.outputs.zenz == 'true'
        run: |
          TASKS=""
          if [ "${{ steps.changes.outputs.app }}" = "true" ] || [ "${{ steps.changes.outputs.zenz }}" = "true" ]; then
            # necookey's own tests; the full Sumire app suite (Robolectric) is not run on every push.
            TASKS="$TASKS :app:testFullStandardDebugUnitTest --tests com.kazumaproject.markdownhelperkeyboard.converter.candidatebar.* --tests com.kazumaproject.markdownhelperkeyboard.converter.quality.* --tests com.kazumaproject.markdownhelperkeyboard.converter.path_algorithm.LatticeLmCostTest --tests com.kazumaproject.markdownhelperkeyboard.zeroquery.ZeroQueryBackoffTest"
          fi
          if [ "${{ steps.changes.outputs.core }}" = "true" ]; then TASKS="$TASKS :core:testDebugUnitTest"; fi
          if [ "${{ steps.changes.outputs.custom_keyboard }}" = "true" ]; then TASKS="$TASKS :custom_keyboard:testDebugUnitTest"; fi
          ./gradlew $TASKS $GRADLE_FLAGS $LATTICE_LM_FLAGS --quiet

      - name: Locate APK and verify no INTERNET permission
        id: apk
        run: |
          APK=$(find app/build -name '*.apk' -path '*fullStandard*' -path '*release*' | grep -v androidTest | head -1)
          if [ -z "$APK" ]; then echo "APK not found"; find app/build -name '*.apk'; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then echo "INTERNET permission present"; exit 1; fi
          # A testOnly APK is refused by the phone's package installer.
          if "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'testOnly'; then echo "APK is testOnly"; exit 1; fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # Must be the committed keystore/necookey-ci.jks key, so CI APKs update each other.
          grep -qi 'SHA-256 digest: 1059b9983918fe69a979ddc552a7bde3e3f4b011dcdcbc253efefb33a366fa1f' certs.txt || { echo "APK not signed with keystore/necookey-ci.jks"; exit 1; }
          ls -la "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: necookey-fullStandard-release-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Phones cannot download zipped Actions artifacts without signing in, so pushes to main
      # also publish the plain APK to the rolling `nightly` prerelease (asset replaced each run):
      # https://github.com/${{ github.repository }}/releases/download/nightly/necookey-arm64.apk
      - name: Publish APK to the nightly prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.apk.outputs.path }}" necookey-arm64.apk
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          NOTES="Rolling CI build of main @ ${GITHUB_SHA::7}. Signed with keystore/necookey-ci.jks; installs as an update over earlier nightly builds."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "necookey nightly" --notes "$NOTES"
          else
            gh release create nightly --prerelease --title "necookey nightly" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload nightly necookey-arm64.apk --clobber
